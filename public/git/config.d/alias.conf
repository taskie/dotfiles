[alias]
    a   = add
    b   = blame
    br  = branch
    c   = commit
    c1  = clone --depth 1
    ca  = commit --amend
    ci  = commit
    cl  = clone
    cm  = commit -m
    co  = checkout
    d   = diff
    dd  = diff HEAD
    d1  = diff HEAD~
    f   = fetch
    l   = log
    l1  = log --oneline
    ll  = log --oneline --pretty='format:| `%C(yellow)%h%C(reset)` | %cd | %C(green)%an%C(reset) | %s |' --date='format:%Y-%m-%d %H:%M:%S' --abbrev=8
    m   = merge
    pl  = pull
    ps  = push
    rb  = rebase
    rbc = rebase --continue
    r   = reset
    rs  = restore
    rss = restore --source
    s   = status
    sh  = show
    sw  = switch
    t   = tag
    tr  = log --graph --pretty='format:%C(yellow)%h%C(reset) %s %C(green)(%an)%C(reset)%C(red)%d%C(reset)' --abbrev=8
    wc  = whatchanged
    wt  = worktree
    wtl = worktree list
